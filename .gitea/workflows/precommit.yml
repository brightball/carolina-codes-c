# One Gitea Actions job per quality-gate check, after a shared prepare
# stage that builds a local job image with the toolchain. Not a single
# combined job. Check jobs wait on prepare (not on one another) so they
# run in parallel after prepare succeeds.
#
# The runner force-pulls container.image, so a local tag cannot be the
# job image. Prepare builds carolina-codes-c-ci on the daemon (docker.sock
# is already mounted). Check jobs start from docker:27-cli and docker-run
# that prepared image.
#
# Empty images: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not git init or set
# init.defaultBranch here. The workspace mount hides image contents, so
# the prepared container still clones then runs only its make target.
name: precommit

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apk add --no-cache git ca-certificates
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: |
          docker build -t "carolina-codes-c-ci:${GITHUB_SHA}" -t carolina-codes-c-ci:precommit - < .gitea/ci.Dockerfile
          docker image inspect "carolina-codes-c-ci:${GITHUB_SHA}" >/dev/null

  test:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DATABASE_URL: postgres://postgres:postgres@127.0.0.1:1/carolina_dev?connect_timeout=1
    steps:
      - run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITEA_TOKEN \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            -e DATABASE_URL \
            "carolina-codes-c-ci:${GITHUB_SHA}" \
            sh -e -c '
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          make test
          '

  sast:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITEA_TOKEN \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            "carolina-codes-c-ci:${GITHUB_SHA}" \
            sh -e -c '
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          make sast
          '

  vuln:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITEA_TOKEN \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            "carolina-codes-c-ci:${GITHUB_SHA}" \
            sh -e -c '
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          make vuln
          '

  secrets:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITEA_TOKEN \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            "carolina-codes-c-ci:${GITHUB_SHA}" \
            sh -e -c '
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          make secrets
          '

  fmt:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITEA_TOKEN \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            "carolina-codes-c-ci:${GITHUB_SHA}" \
            sh -e -c '
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          make fmt-check
          '
