# One Gitea Actions job per quality-gate check, after a shared prepare
# stage that builds a local job image with the toolchain. Not a single
# combined job. Check jobs wait on prepare (not on one another) so they
# run in parallel after prepare succeeds.
#
# Empty images: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not git init or set
# init.defaultBranch here. The workspace mount hides image contents, so
# check jobs still clone then run only their make target.
name: precommit

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/docker:27-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apk add --no-cache git ca-certificates
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: |
          docker build -t "carolina-codes-c-ci:${GITHUB_SHA}" -t carolina-codes-c-ci:precommit - < .gitea/ci.Dockerfile
          docker image inspect "carolina-codes-c-ci:${GITHUB_SHA}" >/dev/null

  test:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: carolina-codes-c-ci:${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DATABASE_URL: postgres://postgres:postgres@127.0.0.1:1/carolina_dev?connect_timeout=1
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make test

  sast:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: carolina-codes-c-ci:${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make sast

  vuln:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: carolina-codes-c-ci:${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make vuln

  secrets:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: carolina-codes-c-ci:${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make secrets

  fmt:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: carolina-codes-c-ci:${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make fmt-check
